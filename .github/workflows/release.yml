name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w \
            -X main.version=${VERSION} \
            -X main.commitSHA=${COMMIT} \
            -X main.buildDate=${BUILD_DATE}"

          mkdir -p dist

          # zsh is the target shell, so only unix-y platforms are built.
          GOOS=linux  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/zhc-linux-amd64  ./cmd/zhc
          GOOS=linux  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/zhc-linux-arm64  ./cmd/zhc
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/zhc-darwin-amd64 ./cmd/zhc
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/zhc-darwin-arm64 ./cmd/zhc

          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
